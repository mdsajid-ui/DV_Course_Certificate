# Example reverse-proxy config for hosting both services on ONE domain,
# so the QR's /verify/{number} path and the Streamlit admin app can coexist.
#
# Run the two processes separately:
#   streamlit run app.py --server.port 8501
#   python verify_service/verify_app.py     # reads VERIFY_SERVICE_PORT, default 8000
#
# Then point your domain (the same one you put in
# CERTIFICATE_VERIFICATION_BASE_URL) at this nginx config.

server {
    listen 443 ssl;
    server_name your-domain.example.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example.com/privkey.pem;

    # Public certificate verification — exact /verify/{number} path
    location /verify/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Everything else -> the Streamlit admin app (login-gated)
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
    }
}
