<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DV Analytics Certificate Verification</title>
  <script>
    (function() {
      // Forward query parameters and hash to root index.html
      var search = window.location.search;
      var hash = window.location.hash;
      window.location.replace('../' + search + hash);
    })();
  </script>
</head>
<body style="font-family:sans-serif; text-align:center; padding:50px;">
  <h2>Redirecting to verification registry...</h2>
</body>
</html>
